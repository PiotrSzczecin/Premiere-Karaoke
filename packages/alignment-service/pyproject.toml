[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "premiere-karaoke-sync"
version = "0.4.0"
description = "Lokalny forced alignment SRT dla panelu Premiere Karaoke UXP"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
exact = [
  "whisperx>=3.3,<4",
  "torch>=2.2",
  "torchaudio>=2.2"
]
build = ["pyinstaller>=6.10"]

[project.scripts]
karaoke-sync = "karaoke_sync.server:main"

[tool.setuptools]
packages = ["karaoke_sync"]
